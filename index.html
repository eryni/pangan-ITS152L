<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #DBFFCB 0%, #BEE4D0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            max-width: 650px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .profile-section {
            flex-shrink: 0;
        }

        .profile-pic {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #FF8282;
            object-fit: cover;
            background: #f5f5f5;
            box-shadow: 0 4px 16px rgba(255, 99, 99, 0.2);
        }

        .info-section {
            flex: 1;
            text-align: left;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 8px;
            color: #2d2d2d;
            font-weight: 700;
        }

        .checkmark {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: #FF6363;
            border-radius: 50%;
            margin-left: 8px;
            position: relative;
            vertical-align: middle;
        }

        .checkmark::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 14px;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .info-item {
            margin-top: 24px;
        }

        .label {
            color: #666;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .value {
            color: #2d2d2d;
            font-size: 1.1em;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                text-align: center;
                gap: 30px;
            }

            .info-section {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-section">
            <img src="profile.png" alt="Profile Picture" class="profile-pic">
        </div>
        
        <div class="info-section">
            <h1>Nela Ryne Pangan<span class="checkmark"></span></h1>
            
            <div class="info-item">
                <div class="label">Section</div>
                <div class="value">ITS152L-FOPM01</div>
            </div>
            
            <div class="info-item">
                <div class="label">Program</div>
                <div class="value">Information Technology</div>
            </div>
        </div>
    </div>
</body>
</html>
